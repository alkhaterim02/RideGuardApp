plugins { id 'com.android.application' }

// google-services.json (Firebase console > Project settings > Android app) goes in this folder.
// Without it the app can still run against the local Firebase emulators (rideguard.emulatorHost in local.properties).
def hasGoogleServices = file('google-services.json').exists()
if (hasGoogleServices) apply plugin: 'com.google.gms.google-services'

def localProps = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { localProps.load(it) }
def emulatorHost = localProps.getProperty('rideguard.emulatorHost', '')

android {
    namespace 'com.rideguard.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rideguard.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
        buildConfigField 'String', 'EMULATOR_HOST', "\"${emulatorHost}\""
        buildConfigField 'boolean', 'HAS_GOOGLE_SERVICES', "${hasGoogleServices}"
    }
    buildFeatures { viewBinding true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    testImplementation 'junit:junit:4.13.2'
}
